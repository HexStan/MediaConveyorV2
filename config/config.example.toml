# ============================================================
# MediaConveyor 示例配置
#
# 本文件仅列出各配置项的中文含义、允许填写范围与默认值；
# 行为细节、规则语法与完整教程见 README「配置向导」。
# 用法：复制本文件为 config/config.toml，按需修改。
# ============================================================

# ============================================================
# 基础配置
# ============================================================

# 【选填】实例标识名：锁文件、控制文件与日志前缀的公共基名
# 范围：仅填名称（不带路径/后缀）；缺省或非法时使用默认标识 mediaconveyor
# instance_name = "media-conveyor-v2"

# 【选填】日志目录（相对路径以程序所在目录为基准）；默认 "./logs"
# log_dir = "./logs"

# 【选填】状态数据库目录（SQLite，记录处理状态与失败计数）；默认 "./data"
# data_dir = "./data"

# 【选填】最多保留 N 天的日志文件；默认 0
# 范围：≥ 0 的整数，0 表示不清理
# max_log_files = 7

# 【选填】日志级别；默认 "INFO"
# 范围："DEBUG" / "INFO" / "SUCCESS" / "WARNING" / "ERROR" / "CRITICAL"
# log_level = "INFO"

# ============================================================
# 调度配置（可选）：省略本节或不填 mode = 一次性运行（扫描处理一轮后退出）
# ============================================================

[schedule]
# 【必填】定时模式；范围："interval"（固定间隔）/ "cron"（cron 表达式）
mode = "interval"

# 【interval 模式必填】扫描间隔（秒）；范围：> 0 的数字
interval_seconds = 60

# 【cron 模式必填】cron 表达式（5 段）
cron_expr = "0 * * * *"

# 【选填】首轮延迟（秒）；默认 -1
# 范围：负数（等待至下个调度时间点）/ 0（启动后立即执行）/ 正数（等待 N 秒后执行首轮）
# first_run_delay = 0

# ============================================================
# 任务
# ============================================================
# 每个 [[tasks]] 节定义一个监听与 FFmpeg 处理任务，紧邻的 [tasks.filter] 是它的过滤条件。

[[tasks]]
# 【选填】依赖的前置任务 id 列表：前置任务在本轮完成后才会执行本任务
# 范围：id 数组，仅允许引用配置顺序中位于本任务之前的任务 id（单个字符串视为单元素列表）
# depends_on = []

# 【选填】任务标识：供其他任务的 depends_on 引用
# 范围：a-z、A-Z、0-9、-、_，须在所有任务中唯一；非法时视为无 id
# id = "TranscodeVideos"

# 【选填】任务名称，仅用于日志展示
# name = "视频转码"

# 【必填】源目录：监听并扫描其中的音视频文件（递归子目录）
source_dir = "/data/Videos/Raw"

# 【必填】目标目录：处理输出目录（保持源目录的子目录结构）
dest_dir = "/data/Videos/Final"

# 【选填】成功后源文件的备份目录（保持子目录结构）；默认不备份
# remove_source = true 时本项被忽略
# backup_dir = "./backup"

# 【选填】失败达到上限后的隔离目录（保持子目录结构）；默认不启用（失败文件永久留在源目录）
# 范围：不得位于 source_dir / dest_dir 之内，不得与 backup_dir 相同；
# failure_dir = "./failed"

# 【选填】文件稳定性检查：等待 N 秒后复查文件大小是否变化，有变化则跳过本轮；默认 0
# 范围：≥ 0，0 表示不检查
# stable_duration = 5

# 【选填】FFmpeg 单文件处理超时（秒），超时终止进程并按失败计数；默认 0
# 范围：≥ 0，0 表示不限
# ffmpeg_timeout = 3600

# 【必填】输出文件名模板：{basename} → 源文件名（不含扩展名），
# 输出扩展名直接写在模板里；须为纯文件名（不允许路径分隔符）
output_filename = "{basename}-encoded.mp4"

# 【必填】FFmpeg 参数模板：{input} → 源文件完整路径；{output} → 输出文件完整路径
#（文件名由 output_filename 决定）。ffmpeg 可执行文件与预置参数（-y 覆盖输出、
# -nostdin 禁用 stdin 等）由程序自动添加，本模板只填参数。占位符书写规则详见
# README 第三步
ffmpeg_cmd = """
-i {input} \
  -c:v libx265 \
  -preset medium \
  -crf 26 \
  {output}
"""

# 【选填】主命令连续失败多少次后切换备用命令；默认 0
# 范围：≥ 0 的整数，0 表示不启用；配置本项须同时配置 ffmpeg_cmd_fallback
# fallback_count = 3

# 【选填】备用参数模板：主命令连续失败 fallback_count 次后启用
#（与主命令共用 output_filename）
# ffmpeg_cmd_fallback = """
# -i {input} \
#   -c:v libx264 \
#   -preset medium \
#   -crf 26 \
#   {output}
# """

# 【选填】单个文件失败次数上限，达到后永久跳过该文件（成功一次即清零）；默认 3
# 0 表示永不因失败跳过，失败文件每轮重试
# 范围：≥ 0 的整数
# failure_count = 3

# 【选填】处理成功后是否删除源文件；默认 false
# remove_source = false

# 【选填】延迟删除：成功 N 分钟后删除源文件（仅 remove_source = true 时生效）；默认 0
# 范围：≥ 0，0 表示立即删除
# source_expired_minutes = 60

# ------------------------------------------------------------
# 过滤条件（可选）：不配置任何条件时处理源目录中的所有文件
# 流水线语义、fnmatch 语法与媒体属性单位详见 README「配置向导」第六步
# ------------------------------------------------------------
[tasks.filter]
# 以下 patterns 均为 fnmatch 模式数组，匹配相对 source_dir 的路径（大小写不敏感）：
#   include_patterns：【选填】仅命中的文件参与处理；不填或为空则包含所有文件
#   exclude_patterns：【选填】命中的文件跳过
#   passthrough_patterns：【选填】命中的文件不经过 FFmpeg，直接移动到目标目录
include_patterns = ["*.mp4", "*.mkv", "*.avi"]
exclude_patterns = ["*.tmp"]
passthrough_patterns = ["*.srt", "*.jpg"]

# 【选填】修改时间冷却（秒）：跳过最近 N 秒内修改过的文件；默认 0
# 范围：≥ 0，0 表示不筛选
# file_mtime = 60

# 【选填】文件大小范围；默认不限
# 范围：{ min = ..., max = ... }；0 表示不限
# size = { min = "100KiB", max = "20GiB" }

# 【选填】视频时长范围；默认不限
# 范围：{ min = ..., max = ... }；0 表示不限
# duration = { min = "1s", max = "6h" }

# 【选填】码率范围（video_bitrate / audio_bitrate / total_bitrate）；默认不限
# 范围：{ min = ..., max = ... }；0 表示不限
# video_bitrate = { min = "200K", max = "50M" }
# audio_bitrate = { min = "64K", max = "3000K" }
# total_bitrate = { min = "256K", max = "50M" }

# 【选填】帧率范围（fps）；默认不限
# 范围：{ min = ..., max = ... }；0 表示不限
# framerate = { min = 15, max = 120 }

# 【选填】分辨率短边范围（像素）；默认不限
# 范围：{ min = ..., max = ... }；0 表示不限
# short_side = { min = 144, max = 4320 }

# 【选填】排除视频/音频编码（大小写不敏感）；默认不限
# 范围：编码名称数组
# exclude_video_codecs = ["av1"]
# exclude_audio_codecs = ["mp3"]

# ------------------------------------------------------------

# 第二个任务示例：音频转码
[[tasks]]
source_dir = "/data/Music/Raw"
dest_dir = "/data/Music/Final"

output_filename = "{basename}.m4a"
ffmpeg_cmd = """
-i {input} \
  -c:a aac \
  -b:a 256k \
  -vn \
  {output}
"""
