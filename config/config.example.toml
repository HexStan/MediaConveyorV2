# MediaConveyor 示例配置
#
# 使用方法：复制本文件为 config/config.toml，按需修改。
# 各配置项的完整说明见 README.md 的配置向导。

# ============================================================
# 基础配置
# ============================================================

# 【选填】实例标识名：锁文件、控制文件与日志前缀的公共基名。
# 范围：仅填名称（不带路径/后缀）；缺省或非法时使用默认标识 mediaconveyor
# instance_name = "mediaconveyor"

# 【选填】日志目录（相对路径以程序所在目录为基准）；默认 ./logs
# log_dir = "./logs"

# 【选填】状态数据库目录（SQLite，记录处理状态与失败计数）；默认 ./data
# data_dir = "./data"

# 【选填】最多保留 N 天的日志文件；0 表示不清理。默认 0
# max_log_files = 7

# 【选填】日志级别：DEBUG（详细）/ INFO（常规）/ WARNING / ERROR / CRITICAL。默认 INFO
# log_level = "INFO"

# ============================================================
# 调度配置（可选）
# ============================================================
# 省略整个 [schedule] 节 = 一次性运行：扫描处理一轮后退出（适合 cron 触发）。
# 配置了 [schedule] 则常驻运行，按周期自动扫描。

[schedule]
# 定时模式：interval（固定间隔）/ cron（cron 表达式）
mode = "interval"

# interval 模式：扫描间隔（秒）
interval_seconds = 60

# cron 模式：cron 表达式（5 段），例如每小时第 0 分钟执行
# mode = "cron"
# cron_expr = "0 * * * *"

# 【选填】首轮延迟（秒）：-1（默认）等待至下个调度时间点；0 启动后立即执行；
# 正数等待指定秒数后执行首轮
# first_run_delay = 0

# ============================================================
# 任务
# ============================================================
# 每个 [[tasks]] 节定义一个监听与转码任务，紧邻的 [tasks.filter] 是它的过滤条件。

[[tasks]]
# 【选填】任务标识：供其他任务的 depends_on 引用（a-z、A-Z、0-9、-、_）
# id = "anime"

# 【选填】任务名称，用于日志标识；缺省为"任务 N"
name = "视频转码"

# 【必填】源目录：监听并扫描其中的音视频文件（递归子目录）
source_dir = "./source"

# 【必填】目标目录：转码输出目录（保持源目录的子目录结构）
dest_dir = "./dest"

# 【必填】FFmpeg 命令模板：
# - {input} → 源文件完整路径；{output} → 目标目录下的基础文件名（不含扩展名），
#   输出扩展名由模板决定（示例为 -encoded.mp4）；
# - 支持多行书写（执行时自动合并为单行）；路径要加引号；
# - 命令中不能出现 {input}/{output} 之外的花括号占位符。
ffmpeg_cmd = """
ffmpeg -y \
  -i "{input}" \
  -c:v libx264 \
  -preset fast \
  -crf 23 \
  "{output}-encoded.mp4"
"""

# 【选填】备用命令模板：主命令连续失败 fallback_count 次后启用
# ffmpeg_cmd_fallback = """
# ffmpeg -y \
#   -i "{input}" \
#   -c:v libx264 \
#   -preset medium \
#   -crf 28 \
#   "{output}-encoded.mp4"
# """

# 【选填】连续 FFmpeg 失败多少次后切换备用命令；0 表示不启用。默认 0
# fallback_count = 3

# 【选填】单个文件失败次数上限，达到后永久跳过该文件；成功一次即清零。默认 3
# failure_count = 3

# 【选填】FFmpeg 单文件处理超时（秒），超时终止进程并按失败计数；0 表示不限。默认 0
# ffmpeg_timeout = 3600

# 【选填】稳定性检查：等待 N 秒后复查文件大小是否变化，有变化则跳过本轮。
# 用于等待下载/复制中的文件写完；0 表示不检查。默认 0
# stable_duration = 5

# 【选填】处理成功后是否删除源文件。默认 false
# remove_source = false

# 【选填】延迟删除：成功 N 分钟后删除源文件（仅 remove_source = true 时生效）；
# 0 表示立即删除。默认 0
# source_expired_minutes = 60

# 【选填】成功后源文件的备份目录（保持子目录结构）；
# remove_source = true 时本项被忽略。默认不备份
# backup_dir = "./backup"

# 【选填】依赖的前置任务 id 列表：前置任务在本轮完成后才会执行本任务
# depends_on = []

# ------------------------------------------------------------
# 过滤条件（可选）：不配置任何条件时处理源目录中的所有文件
# ------------------------------------------------------------
[tasks.filter]
# 文件名匹配（fnmatch 语法，匹配相对 source_dir 的路径，不区分大小写，
# 路径分隔符统一为 /），按 include → exclude → passthrough 顺序流水线过滤：
#   1. include_patterns：不匹配则跳过（不填或为空则包含所有文件）；
#   2. exclude_patterns：匹配则跳过；
#   3. passthrough_patterns：匹配则不经过 FFmpeg 直接移动到目标目录
#     （不触发 ffprobe，但仍受 file_mtime 约束）。
include_patterns = ["*.mp4", "*.mkv", "*.avi"]
exclude_patterns = ["*.tmp"]
passthrough_patterns = ["*.srt", "*.jpg"]

# 【选填】修改时间冷却（秒）：跳过最近 N 秒内修改过的文件；0 表示不筛选。默认 0
# file_mtime = 300

# 【选填】文件大小范围（支持 "100MB"、"1.5GiB" 等单位；0 表示不限）
# size = { min = "100MB", max = "20GB" }

# 【选填】视频时长范围（支持 "10s"、"2h"、"1h30m" 等；0 表示不限）。
# 注意：以下媒体属性条件任意一项生效都会触发 ffprobe
# duration = { min = "10s", max = "2h" }

# 【选填】码率范围（十进制单位：1K = 1000bps；支持 "500K"、"1Mbps" 等）
# video_bitrate = { min = "500K", max = "50M" }
# audio_bitrate = { min = "64K", max = "320K" }
# total_bitrate = { min = "1M", max = "50M" }

# 【选填】帧率范围（fps）
# framerate = { min = 24, max = 60 }

# 【选填】分辨率短边范围（像素）
# short_side = { min = 720, max = 2160 }

# 【选填】排除视频/音频编码（大小写不敏感）
# exclude_video_codecs = ["hevc", "av1"]
# exclude_audio_codecs = ["opus"]

# 第二个任务示例：音频转码
[[tasks]]
name = "音频转码"
source_dir = "./music"
dest_dir = "./audio"
ffmpeg_cmd = """
ffmpeg -y \
  -i "{input}" \
  -c:a libmp3lame \
  -q:a 2 \
  "{output}.mp3"
"""

[tasks.filter]
include_patterns = ["*.flac", "*.wav"]
