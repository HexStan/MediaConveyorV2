services:
  media-conveyor:
    image: ghcr.io/hexstan/mediaconveyorv2:latest
    container_name: media-conveyor-v2
    restart: unless-stopped
    environment:
      - TZ=Asia/Shanghai

    volumes:
      # 配置文件与运行时数据目录
      - ./config:/app/config
      - ./logs:/app/logs
      - ./data:/app/data

      # 媒体生命周期目录
      - ./source:/app/source
      - ./dest:/app/dest
      - ./backup:/app/backup
      - ./failed:/app/failed

    # 启用 Intel/AMD GPU 支持 (VAAPI/QSV)
    devices:
      - /dev/dri:/dev/dri
    # 启用 NVIDIA GPU 支持
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu, video, compute, utility]
